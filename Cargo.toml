[workspace]
resolver = "2"
members = [ "leptos-chartistry" ]
exclude = [ "demo", "examples/ssr" ]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"

# With Leptos 0.8 the following error comes up:
# > [wasm-validator error in function 4178] unexpected false: Bulk memory operations require bulk memory [--enable-bulk-memory],
# When the following is enabled:
#strip = true
# Discovered by https://github.com/leptos-rs/cargo-leptos/issues/441

# Compile times have exploded and sometimes result in wasm linker errors with Leptos 0.7. This reduces the impact.
[profile.dev]
debug = false

[patch.crates-io]
leptos = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
leptos_meta = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
leptos_router = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
leptos_axum = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
reactive_stores = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
reactive_graph = { git = "https://github.com/tysen/leptos", branch = "leptos_0.9" }
leptos-use = { git = "https://github.com/tysen/leptos-use", branch = "leptos_0.9" }
